name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "docker/**"
      - "drizzle/**"
      - "public/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.portainer.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker-Image testen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: family-base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
