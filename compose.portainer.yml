services:
  family-base:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-base
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PORT: 3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - family_base_data:/data
    ports:
      - "${FAMILY_BASE_BIND_IP:-0.0.0.0}:${FAMILY_BASE_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  family_base_data:
    name: family_base_data
